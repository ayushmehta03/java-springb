# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/devlink}
spring.data.mongodb.database=${MONGO_DB:devlink}

# JWT
jwt.secret=${JWT_SECRET:your-very-long-secret-key-change-in-production}
jwt.expiration-ms=86400000

# Cookie
cookie.secure=true
cookie.same-site=None
cookie.domain=

# Mail (configure for your SMTP provider)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# DiceBear avatar base URL
app.avatar.base-url=https://api.dicebear.com/7.x/initials/svg

# CORS - update to your frontend URL
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.devlink=DEBUG
